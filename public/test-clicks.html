<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DIE click test</title>
</head>
<body>
  <header><h1>DIE click test</h1></header>
  <main>
    <p>Clicks on this local test page are sent through DIE to local Umami.</p>
    <p id="delivery" role="status">Loading test registry…</p>

    <nav aria-label="Test links">
      <ul>
        <li><a href="/health" target="_blank">Relative internal link</a></li>
        <li><a href="https://labs.diainspace.com/" target="_blank" rel="noopener">Registered domain</a></li>
        <li><a href="https://example.org/" target="_blank" rel="noopener">External domain</a></li>
        <li><a href="#result">Same-page anchor</a></li>
      </ul>
    </nav>

    <pre id="result">Click details will appear here.</pre>
  </main>

  <script type="module">
    import { installClickTracker } from '/tracker/click-listener.js';

    const registryResponse = await fetch('/api/domains');
    if (!registryResponse.ok) throw new Error('Test registry could not be loaded');
    const { domains } = await registryResponse.json();
    const delivery = document.querySelector('#delivery');
    delivery.textContent = 'Ready to capture a test click.';

    installClickTracker({
      domains,
      onClick(event) {
        console.log('DIE click:', event);
        document.querySelector('#result').textContent =
          JSON.stringify(event, null, 2);
        delivery.textContent = 'Sending test click…';
        // Do not await or prevent navigation. keepalive allows completion on page exit.
        fetch('/api/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(event),
          keepalive: true,
        }).then(async response => {
          const result = await response.json();
          if (!response.ok || !result.accepted) throw new Error('Click was not accepted');
          delivery.textContent = 'Accepted by local Umami.';
          console.log('DIE delivery:', result);
        }).catch(() => {
          // Diagnostics belong to this development page, not a production visitor UI.
          delivery.textContent = 'Test delivery failed; navigation was not blocked.';
          console.warn('DIE test click could not be delivered.');
        });
      },
    });
  </script>

  <footer>
    <a href="#result">Footer test</a>
    <a href="#result" data-analytics-place="featured" data-analytics-scope="external" data-analytics-name="Featured Labs">Override test</a>
  </footer>

</body>
</html>
